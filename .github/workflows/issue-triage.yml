name: Issue triage

# Issue mới chưa có nhãn → gắn "cần phân loại" để nhóm xử lý trong buổi họp.
on:
  issues:
    types: [opened]

permissions:
  issues: write

jobs:
  label:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const labels = context.payload.issue.labels.map(l => l.name);
            if (labels.length === 0) {
              await github.rest.issues.addLabels({ ...context.repo, issue_number: context.issue.number, labels: ['cần phân loại'] });
            }
