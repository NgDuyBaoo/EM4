name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: backend

jobs:
  lint:
    name: Kiểm tra code style (Pint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with: { php-version: '8.3', tools: composer:v2, coverage: none }
      - uses: actions/cache@v4
        with:
          path: backend/vendor
          key: vendor-${{ hashFiles('backend/composer.lock') }}
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: vendor/bin/pint --test

  test:
    name: Test (Pest) – ${{ matrix.db }}
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        db: [sqlite, mysql]
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: ngoi_test
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=10s --health-timeout=5s --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with: { php-version: '8.3', extensions: 'pdo_mysql, pdo_sqlite, intl', tools: composer:v2, coverage: pcov }
      - uses: actions/cache@v4
        with:
          path: backend/vendor
          key: vendor-${{ hashFiles('backend/composer.lock') }}
      - run: composer install --no-interaction --prefer-dist --no-progress
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: backend/package-lock.json }
      - run: npm ci && npm run build
      - run: cp .env.example .env && php artisan key:generate
      - name: Chạy test
        env:
          DB_CONNECTION: ${{ matrix.db }}
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: ${{ matrix.db == 'mysql' && 'ngoi_test' || ':memory:' }}
          DB_USERNAME: root
          DB_PASSWORD: root
        run: vendor/bin/pest --coverage
      - name: Kiểm tra migration + seeder chạy được
        if: matrix.db == 'mysql'
        env: { DB_CONNECTION: mysql, DB_HOST: 127.0.0.1, DB_DATABASE: ngoi_test, DB_USERNAME: root, DB_PASSWORD: root }
        run: php artisan migrate:fresh --seed --force

  api-docs:
    name: Tài liệu API (Scramble)
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with: { php-version: '8.3', tools: composer:v2, coverage: none }
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: cp .env.example .env && php artisan key:generate
      # Scramble đọc cấu trúc bảng để suy ra kiểu dữ liệu, nên cần một database đã migrate (SQLite cho nhanh)
      - name: Tạo database SQLite cho Scramble
        env: { DB_CONNECTION: sqlite, DB_DATABASE: database/ci.sqlite }
        run: touch database/ci.sqlite && php artisan migrate --force
      - name: Phân tích API
        env: { DB_CONNECTION: sqlite, DB_DATABASE: database/ci.sqlite }
        run: php artisan scramble:analyze
      - name: Xuất openapi.json
        env: { DB_CONNECTION: sqlite, DB_DATABASE: database/ci.sqlite }
        run: php artisan scramble:export --path=openapi.json
      - uses: actions/upload-artifact@v4
        with: { name: openapi, path: backend/openapi.json }

  integrations:
    name: Gọi thật API ngoài (Open-Meteo, VietQR)
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with: { php-version: '8.3', tools: composer:v2, coverage: none }
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: cp .env.example .env && php artisan key:generate
      - name: Kiểm tra API ngoài
        env:
          CACHE_STORE: array
          # Tùy chọn: thêm 2 secret này trong Settings > Secrets để kiểm cả API VietQR có khóa
          VIETQR_CLIENT_ID: ${{ secrets.VIETQR_CLIENT_ID }}
          VIETQR_API_KEY: ${{ secrets.VIETQR_API_KEY }}
        run: |
          php artisan ngoi:check-integrations --json=integrations.json | tee integrations.txt
          { echo '## Kết quả gọi thật API ngoài'; echo '```'; cat integrations.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with: { name: integrations-evidence, path: 'backend/integrations.*' }

  docker:
    name: Build Docker image
    runs-on: ubuntu-latest
    needs: test
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f deploy/docker/app.Dockerfile -t ngoi-app .
      - name: Kiểm tra docker-compose (mọi container Laravel đều dùng MySQL)
        run: |
          cp deploy/.env.example deploy/.env
          docker compose -f deploy/docker-compose.yml config --format json > /tmp/compose.json
          for svc in app queue scheduler pulse; do
            jq -e --arg s "$svc" '.services[$s].environment | .DB_CONNECTION == "mysql" and .APP_ENV == "production"' /tmp/compose.json > /dev/null \
              || { echo "::error::service $svc thiếu DB_CONNECTION=mysql hoặc APP_ENV=production"; exit 1; }
          done
          echo "OK: app, queue, scheduler, pulse đều dùng MySQL"
