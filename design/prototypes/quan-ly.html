<!DOCTYPE html>
<html lang="vi"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ngói Photobooth – Quản lý</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Be+Vietnam+Pro:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#F6EFE6;--surface:#FFFBF6;--ink:#3B2416;--muted:#8A6F5C;--brand:#7A4A2B;--brand-ink:#FFF8F0;--line:#E4D6C6;--sel:#F3DDBB;
--free:#EEF3ED;--booked:#F8EACE;--shoot:#DBE8F6;--cancel:#F6DFDD;--done:#E5E0DA;
--sched-head:#F9F3EC;--sched-grid:#E9DCCE;--sched-time:#FBF7F2;--sched-shadow:rgba(122,74,43,.08);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1D140E;--surface:#2A1D14;--ink:#F3E6D6;--muted:#B49A82;--brand:#D9A06B;--brand-ink:#2A1608;--line:#4A3626;--sel:#4A3320;--free:#2F5A33;--booked:#7A5A22;--shoot:#2D4E73;--cancel:#7A3A36;--done:#4A4038;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1D140E;--surface:#2A1D14;--ink:#F3E6D6;--muted:#B49A82;--brand:#D9A06B;--brand-ink:#2A1608;--line:#4A3626;--sel:#4A3320;--free:#2F5A33;--booked:#7A5A22;--shoot:#2D4E73;--cancel:#7A3A36;--done:#4A4038;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.55 'Be Vietnam Pro',system-ui,sans-serif}
h1,h2,h3,.serif{font-family:'Playfair Display',Georgia,serif;margin:0}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 20px;background:var(--brand);color:var(--brand-ink)}
.logo{font:700 30px/1 'Playfair Display',serif}.logo small{display:block;font:500 9px 'Be Vietnam Pro';letter-spacing:.3em}
.tabs{display:flex;background:rgba(0,0,0,.18);border-radius:999px;padding:3px}
.tabs button{border:0;background:none;color:inherit;padding:6px 14px;border-radius:999px;font:500 13px inherit;cursor:pointer}
.tabs button.on{background:var(--brand-ink);color:var(--brand)}
main{max-width:880px;margin:0 auto;padding:20px 16px 48px}
.steps{display:flex;gap:6px;margin-bottom:20px}
.steps i{flex:1;height:5px;border-radius:3px;background:var(--line)}.steps i.on{background:var(--brand)}
h2{font-size:26px;margin-bottom:4px}.sub{color:var(--muted);margin:0 0 18px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px}
.opt{display:flex;gap:14px;align-items:center;width:100%;text-align:left;background:var(--surface);color:inherit;border:1.5px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px;cursor:pointer;font:inherit}
.opt.on{border-color:var(--brand);background:var(--sel)}
.ph{width:84px;height:64px;border-radius:10px;flex:none;background:linear-gradient(135deg,#C9A27A,#7A4A2B)}
.opt b{display:block;font-size:16px}.opt span{color:var(--muted);font-size:13px}
.btn{background:var(--brand);color:var(--brand-ink);border:0;border-radius:10px;padding:12px 22px;font:600 15px inherit;cursor:pointer}
.btn:disabled{opacity:.4;cursor:not-allowed}.btn.ghost{background:none;color:var(--brand);border:1.5px solid var(--brand)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:18px}
.code{display:flex;gap:8px;justify-content:center;margin:12px 0}
.code input{width:46px;height:56px;text-align:center;font:600 24px 'Playfair Display',serif;border:1.5px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink)}
input.f,select{width:100%;padding:11px 12px;border:1.5px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);font:inherit;margin-bottom:10px}
.hint{font-size:12.5px;color:var(--muted);text-align:center}.err{color:#C0392B;text-align:center;min-height:22px;font-size:13.5px}
.slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(74px,1fr));gap:8px;max-height:340px;overflow:auto;padding:2px}
.slot{padding:10px 0;border:1.5px solid var(--line);border-radius:9px;background:var(--surface);color:var(--ink);font:500 14px inherit;cursor:pointer}
.slot.on{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.slot:disabled{opacity:.35;text-decoration:line-through;cursor:not-allowed}
dl{display:grid;grid-template-columns:90px 1fr;gap:8px 12px;margin:0}dt{color:var(--muted)}dd{margin:0;font-weight:500}
.ok{width:72px;height:72px;border-radius:50%;background:var(--brand);color:var(--brand-ink);display:grid;place-items:center;font-size:36px;margin:0 auto 12px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:16px}
.stat b{font:700 26px 'Playfair Display',serif;display:block}.stat span{color:var(--muted);font-size:13px}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:13px;margin:10px 0}.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.scroll{overflow-x:auto;max-height:300px;overflow-y:auto}
table{border-collapse:collapse;width:100%;font-size:14px}th,td{padding:8px 10px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
.g td.c{height:26px;border-left:2px solid var(--bg)}
.pill{padding:3px 10px;border-radius:999px;font-size:12.5px;font-weight:500;color:#2B1B10}
.s-booked{background:var(--booked)}.s-shoot{background:var(--shoot)}.s-cancel{background:var(--cancel)}.s-done{background:var(--done)}
td button{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:7px;padding:4px 9px;margin-right:4px;font:inherit;font-size:12.5px;cursor:pointer}
.hide{display:none}
header{position:relative;margin-bottom:16px;background:radial-gradient(circle at 11px 0,transparent 8px,rgba(255,248,240,.14) 8.5px 9.5px,transparent 10px) 0 0/22px 11px,var(--brand)}
header::after{content:"";position:absolute;left:0;right:0;top:100%;height:11px;background:radial-gradient(circle at 11px 0,var(--brand) 10px,transparent 10.5px) 0 0/22px 11px}
.logo{font-size:34px;letter-spacing:-.01em}
h2{font-size:30px;line-height:1.2;letter-spacing:-.01em}
.sub{font-size:14.5px;max-width:56ch}
main{padding-top:24px}
.card{border-radius:20px;padding:20px;box-shadow:0 10px 30px -18px rgba(59,36,22,.45)}
.btn{border-radius:12px;padding:14px 26px;box-shadow:0 8px 18px -10px var(--brand);transition:transform .15s}
.btn:hover:not(:disabled){transform:translateY(-1px)}
input.f:focus,select:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 4px var(--sel)}
button:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
.stat{padding:16px 18px}.stat b{font-size:30px}
td button{transition:background .15s}td button:hover{background:var(--sel)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* Admin usability upgrade */
main{max-width:1180px}.admin-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;margin-bottom:14px}.admin-top h2{margin:0}.admin-top .sub{margin:4px 0 0}.admin-tools{display:flex;gap:8px;flex-wrap:wrap}.btn-sm{padding:9px 14px!important;font-size:13px!important;box-shadow:none!important}.btn-lite{background:transparent;color:var(--brand);border:1px solid var(--line);box-shadow:none}.btn-lite:hover{background:var(--sel)}.admin-controls{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:12px 0 16px}.admin-controls label{display:block;color:var(--muted);font-size:12px;margin-bottom:4px}.admin-controls select,.admin-controls input{margin:0}.admin-tabs{display:flex;gap:7px;flex-wrap:wrap;margin:12px 0 16px}.admin-tabs button{padding:9px 14px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:500 13px 'Be Vietnam Pro',sans-serif;cursor:pointer}.admin-tabs button.active{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}.section-head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin:22px 0 10px}.section-head h3{font-size:20px}.schedule-wrap{max-height:480px;overflow:auto;border:1px solid var(--line);border-radius:12px}.schedule{border-collapse:separate;border-spacing:0;min-width:500px}.schedule th{position:sticky;top:0;background:var(--surface);z-index:2}.schedule td:first-child,.schedule th:first-child{position:sticky;left:0;background:var(--surface);z-index:1}.schedule th:first-child{z-index:3}.schedule td{padding:0!important;border-bottom:1px solid var(--line)}.schedule .time-col{padding:8px!important;font-size:12px;font-weight:600}.schedule-cell{width:100%;min-height:35px;border:0;border-left:2px solid var(--surface);background:var(--free);color:#30251b;cursor:pointer;font:500 11px 'Be Vietnam Pro',sans-serif;white-space:nowrap}.schedule-cell.booked{background:var(--booked)}.schedule-cell.shoot{background:var(--shoot)}.schedule-cell.cancel{background:var(--cancel)}.schedule-cell.done{background:var(--done)}.schedule-cell:hover,.schedule-cell:focus-visible{outline:2px solid var(--brand);outline-offset:-2px;filter:brightness(.95)}.booking-filters{display:grid;grid-template-columns:minmax(160px,2fr) minmax(120px,1fr);gap:10px;margin:0 0 12px}.booking-filters input,.booking-filters select{margin:0}.booking-list{max-height:460px;overflow:auto}.booking-list table{min-width:740px}.booking-list tr:hover td{background:var(--sel)}.action-btn{padding:6px 10px!important;margin:2px!important}.action-btn.danger{color:#a0322c;border-color:#d9a39d}.empty-state{text-align:center;padding:25px;color:var(--muted)}.detail-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.detail-grid div{background:var(--bg);padding:10px;border-radius:9px}.detail-grid small{display:block;color:var(--muted);font-size:11px}.detail-grid b{font-size:13px}.detail-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.notice{color:var(--muted);font-size:12px;margin:6px 0 0}.stat{box-shadow:none}.stat b{font-family:'Be Vietnam Pro',sans-serif;font-size:25px}.card{box-shadow:0 5px 18px -15px rgba(59,36,22,.5)}
@media(max-width:650px){header{padding:12px 14px}.logo{font-size:27px}main{padding:14px 12px 40px}.admin-controls{grid-template-columns:1fr 1fr}.admin-controls>div:first-child{grid-column:1/-1}.booking-filters{grid-template-columns:1fr}.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.stat{padding:12px}.stat b{font-size:22px}.detail-grid{grid-template-columns:1fr}.admin-tools .btn{flex:1}.card{padding:14px}.schedule-wrap{max-height:380px}}

/* Thanh điều hướng quản lý: text-only, hover nhẹ và gạch chân mục đang mở */
header .tabs{
  display:flex;align-items:center;justify-content:flex-end;gap:5px;
  padding:0;border:0;border-radius:0;background:transparent;flex-shrink:0;
}
header .tabs button{
  appearance:none;position:relative;display:inline-flex;align-items:center;justify-content:center;
  min-height:42px;padding:10px 15px;border:1px solid transparent;border-radius:10px;
  background:transparent;color:var(--brand-ink);box-shadow:none;
  font:600 13.5px/1.3 'Be Vietnam Pro',sans-serif;white-space:nowrap;
  cursor:pointer;transition:background .16s ease,color .16s ease;
}
header .tabs button:hover{background:rgba(255,248,240,.18);color:#fffaf4}
header .tabs button.on{background:transparent;color:var(--brand-ink)}
header .tabs button.on::after{
  content:"";position:absolute;left:16px;right:16px;bottom:5px;
  height:2px;border-radius:2px;background:var(--brand-ink);
}
header .tabs button.on:hover{background:rgba(255,248,240,.18)}
header .tabs button:focus-visible{outline:2px solid var(--brand-ink);outline-offset:2px}
@media(max-width:480px){
  header{gap:7px;padding:11px 11px}
  header .logo{font-size:26px}
  header .tabs{gap:1px}
  header .tabs button{font-size:12px;padding:9px 9px;min-height:40px}
  header .tabs button.on::after{left:9px;right:9px;bottom:5px}
}
@media(prefers-reduced-motion:reduce){header .tabs button{transition:none}}


/* Booking workspace: list and contextual detail */
.booking-workspace{display:grid;grid-template-columns:minmax(0,1fr);gap:14px;align-items:start}
.booking-workspace.has-detail{grid-template-columns:minmax(0,1.4fr) minmax(320px,1fr)}
.booking-main{min-width:0}.booking-side{min-width:0;position:sticky;top:12px}
.booking-list{max-height:560px}.booking-list table{min-width:610px}.booking-list th{position:sticky;top:0;background:var(--surface);z-index:1}
.booking-list tr.selected td{background:var(--sel)!important}.booking-list td{vertical-align:middle}.booking-list .booking-code{font-size:12px;color:var(--muted)}
.booking-list .customer-name{font-weight:600}.booking-list .booking-time{font-weight:600;font-variant-numeric:tabular-nums}
.booking-list .row-actions{display:flex;gap:5px;align-items:center}.booking-list .row-actions button{white-space:nowrap}
.booking-list .action-btn.primary{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.booking-detail-card{margin:0!important;padding:18px!important;border-color:var(--brand)}
.booking-detail-card .detail-heading{display:flex;align-items:start;justify-content:space-between;gap:12px;margin-bottom:14px}
.booking-detail-card .detail-heading h3{font-size:21px;margin:0}.booking-detail-card .detail-heading p{font-size:12px;color:var(--muted);margin:3px 0 0}
.booking-detail-card .detail-summary{background:var(--bg);border-radius:12px;padding:13px;margin-bottom:14px}
.booking-detail-card .detail-summary strong{display:block;font-size:18px}.booking-detail-card .detail-summary .pill{display:inline-block;margin-top:7px}
.booking-detail-card .detail-section-title{font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);margin:13px 0 8px}
.booking-detail-card .detail-grid{gap:8px}.booking-detail-card .detail-grid div{padding:9px 11px;border:1px solid var(--line);background:var(--surface)}
.booking-detail-card .detail-grid b{display:block;overflow-wrap:anywhere}.booking-detail-card .detail-actions{border-top:1px solid var(--line);padding-top:13px;margin-top:15px}
.booking-detail-card .detail-actions .btn{flex:1;min-width:110px}.booking-detail-card .detail-actions .danger{color:#a0322c;border-color:#d9a39d}
.booking-detail-placeholder{border:1px dashed var(--line);border-radius:14px;padding:24px;text-align:center;color:var(--muted);background:var(--surface)}
@media(max-width:920px){.booking-workspace.has-detail{grid-template-columns:minmax(0,1fr)}.booking-side{position:static}.booking-list{max-height:420px}}
@media(max-width:650px){.booking-detail-card .detail-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.booking-detail-card .detail-actions .btn{min-width:0}.booking-list{max-height:370px}}

/* Lịch phòng đa chi nhánh: tự thay đổi số cột và giờ theo cấu hình */
.admin-main-nav{display:flex;gap:7px;align-items:center;flex-wrap:wrap;margin:4px 0 20px;padding:4px;border-bottom:1px solid var(--line)}
.admin-nav-tab{display:inline-flex;align-items:center;gap:7px;min-height:42px;padding:10px 15px;border:1px solid transparent;border-bottom:3px solid transparent;border-radius:8px 8px 0 0;background:transparent;color:var(--muted);font:600 13px 'Be Vietnam Pro',sans-serif;cursor:pointer}
.admin-nav-tab:hover{color:var(--ink);background:var(--sel)}.admin-nav-tab.active{border-bottom-color:var(--brand);color:var(--brand);background:var(--surface)}
.nav-count{border-radius:100px;background:var(--sel);color:var(--brand);padding:1px 7px;font-size:11px}
.branch-switch{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:8px 0 12px}
.branch-chip{display:flex;flex-direction:column;align-items:flex-start;gap:3px;min-width:0;min-height:98px;padding:13px 17px;border:1.5px solid var(--line);border-radius:14px;text-align:left;background:var(--surface);color:var(--ink);cursor:pointer;transition:background .15s,border-color .15s,box-shadow .15s}
.branch-chip span{font-size:11px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
.branch-chip strong{font-size:15px;font-weight:600;line-height:1.4}.branch-chip small{font-size:12px;color:var(--muted)}
.branch-chip.active{background:var(--sel);border-color:var(--brand);box-shadow:inset 4px 0 0 var(--brand)}
.branch-chip.active span,.branch-chip.active small{color:var(--brand)}
.branch-chip:hover{border-color:var(--brand)}
.branch-summary{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:13px;color:var(--muted);margin-bottom:4px}
.admin-schedule-controls{grid-template-columns:repeat(3,minmax(0,1fr))}
.schedule{table-layout:fixed;width:100%}.schedule th{font-size:12px;white-space:normal;text-align:center;padding:12px 7px;border-bottom:1px solid var(--line)}
.schedule .time-col{width:95px;text-align:center;font-variant-numeric:tabular-nums;background:var(--surface)}
.schedule th:first-child{width:95px}.schedule th .room-head-name{display:block;white-space:normal;overflow-wrap:anywhere;line-height:1.4}
.schedule th small{display:block;color:var(--muted);font-size:10px;font-weight:400;margin-top:3px}
.schedule-cell{display:flex;align-items:center;justify-content:center;padding:6px 8px;min-height:38px;text-overflow:ellipsis;overflow:hidden;max-width:100%;font-size:11px}
.schedule-cell.offhours{background:var(--bg);color:var(--muted);cursor:default;opacity:.5}
.schedule-wrap{background:var(--surface);max-height:510px;border-radius:12px}
.schedule td:first-child,.schedule th:first-child{z-index:3}.schedule th:first-child{z-index:5}
.room-config-list{display:grid;gap:12px}.room-config-card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:17px}
.room-config-top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.room-config-top b{display:block;font-size:16px}.small-kicker{display:block;color:var(--muted);font-size:10px;letter-spacing:.1em}
.room-toggle{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--brand);font-weight:600;cursor:pointer}.room-toggle input{width:17px;height:17px;accent-color:var(--brand)}
.room-fields{display:grid;grid-template-columns:1.25fr 1.25fr 1fr 1fr 1fr;gap:10px}
.room-fields label,.hours-fields label{display:block;color:var(--muted);font-size:12px;margin-bottom:4px}
.room-fields input,.hours-fields input{margin-bottom:0}
.room-config-foot{display:flex;justify-content:space-between;align-items:center;margin-top:12px;gap:10px}
.text-action{border:0;background:transparent;color:var(--brand);font:500 12px 'Be Vietnam Pro',sans-serif;cursor:pointer;padding:5px 0}
.text-action.danger{color:#a0322c}.text-action:hover{text-decoration:underline}
.settings-summary{margin-bottom:18px}.settings-summary-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;flex-wrap:wrap}.settings-summary h3{font-size:21px}
.settings-demo{color:var(--muted);font-size:11px;background:var(--bg);border:1px solid var(--line);border-radius:20px;padding:4px 9px}
.hours-fields{display:grid;grid-template-columns:repeat(2,minmax(0,240px));gap:12px;margin:15px 0 10px}
.settings-footer{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;margin:16px 0}
.settings-actions{display:flex;flex-wrap:wrap;gap:8px}
@media(max-width:780px){.room-fields{grid-template-columns:repeat(2,minmax(0,1fr))}.branch-chip strong{font-size:13px}.admin-schedule-controls{grid-template-columns:1fr 1fr}.admin-schedule-controls>div:last-child{grid-column:1/-1}}
@media(max-width:540px){.branch-switch{gap:6px}.branch-chip{padding:11px;min-height:112px}.branch-chip strong{font-size:12px}.branch-chip small{font-size:10px}.branch-summary{font-size:12px}.room-fields{grid-template-columns:1fr 1fr}.hours-fields{grid-template-columns:repeat(2,minmax(0,1fr))}.admin-main-nav{flex-wrap:nowrap;overflow-x:auto}.admin-nav-tab{white-space:nowrap;flex-shrink:0;font-size:12px;padding:10px 12px}.room-config-card{padding:13px}.schedule-wrap{max-height:440px}}


/* Booking directory and cross-check layout */
.schedule-directory-link{display:flex;justify-content:space-between;align-items:center;gap:16px;margin:18px 0;padding:18px 20px;background:var(--surface);border:1px solid var(--line);border-radius:16px}
.schedule-directory-link strong{font-size:15px}.schedule-directory-link .notice{margin:4px 0 0}
.compare-action{border-color:var(--brand)!important;color:var(--brand)!important;white-space:nowrap}
.booking-list .row-actions{display:flex;flex-wrap:wrap;gap:4px}
.booking-list th{position:sticky;top:0;background:var(--surface);z-index:1}
@media(max-width:650px){.schedule-directory-link{flex-direction:column;align-items:stretch}.schedule-directory-link button{width:100%}.admin-main-nav{overflow-x:auto;flex-wrap:nowrap!important}.admin-nav-tab{white-space:nowrap}}

/* Schedule readability refresh */
.schedule-toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin:6px 0 12px}
.schedule-hint{font-size:12.5px;color:var(--muted);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.schedule-hint strong{color:var(--ink);font-weight:600}
.legend.schedule-legend{gap:8px;margin:0}
.legend.schedule-legend span{display:inline-flex;align-items:center;gap:6px;padding:7px 10px;border:1px solid var(--line);border-radius:999px;background:var(--surface);font-size:12px;color:var(--ink)}

function switchBranch(b){A.br=b;UI.window='all';UI.room='all';UI.detail=null;A.q='';render()}
function validPhotoUrl(value){try{const u=new URL(value);return ['http:','https:'].includes(u.protocol)&&!!u.hostname&&!/^(?:photos\.)?example\.com$/i.test(u.hostname)}catch(e){return false}}
function persistPhotoLink(x){NS.update(db=>{const y=findBk(db,x.id);if(!y)return;if(x.link&&validPhotoUrl(x.link))y.link=x.link;else delete y.link});sync()}

// Mỗi slot kéo dài 10 phút. Chỉ xem là đã qua khi slot kết thúc hẳn.
// Dùng đồng hồ thời gian thực, không dùng biến `now` cố định lúc mở trang.
const localDay=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
function slotEnded(t,date=TODAY){
 const d=new Date(),day=localDay(d);
 if(date<day)return true;
 if(date>day)return false;
 return minutes(t)+10 <= d.getHours()*60+d.getMinutes()+d.getSeconds()/60;
}
function setShowPast(show){UI.showPast=!!show;render()}
function pastToggle(count){
 const shown=UI.showPast;
 return `<button type="button" class="past-toggle" aria-pressed="${shown}" onclick="setShowPast(${!shown})" title="${shown?'Ẩn khung giờ đã kết thúc':'Hiển thị lại các khung giờ đã kết thúc để kiểm tra'}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${shown?'<path d="M3 3l18 18M10.6 10.6a2 2 0 0 0 2.8 2.8"/><path d="M9.9 5.3A10.9 10.9 0 0 1 12 5c5 0 9.4 4.1 10 7a10.6 10.6 0 0 1-3.2 5.2M6.4 6.4A11.6 11.6 0 0 0 2 12c.6 2.9 5 7 10 7 1.4 0 2.7-.3 3.9-.9"/>':'<path d="M2 12s3.8-7 10-7 10 7 10 7-3.8 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/>'}</svg><span>${shown?'Ẩn lịch đã qua':'Hiện lịch đã qua'}</span>${count?`<span class="past-count">${count}</span>`:''}</button>`;
}
// Làm mới khi đồng hồ chuyển qua mốc 10 phút (không làm gián đoạn popup/form).
let lastLiveBucket=localDay(new Date())+'-'+Math.floor((new Date().getHours()*60+new Date().getMinutes())/10);
function refreshPastIfNeeded(){
 const d=new Date(),bucket=localDay(d)+'-'+Math.floor((d.getHours()*60+d.getMinutes())/10);
 if(bucket===lastLiveBucket)return;
 if(!A.in||!['bk','list',''].includes(A.page||'')||UI.showPast||UI.walkin||UI.detail?.id||A.ct||document.visibilityState==='hidden')return;
 if(document.activeElement?.closest('input,textarea,select,[contenteditable="true"]'))return;
 lastLiveBucket=bucket;
 const previousY=window.scrollY;
 render();
 window.scrollTo(0,Math.min(previousY,Math.max(0,document.documentElement.scrollHeight-window.innerHeight)));
}
setInterval(refreshPastIfNeeded,15000);
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')refreshPastIfNeeded()});

function compareBooking(id){
 const x=by(bookings,id);if(!x)return;
 // Mở lại lịch đã qua khi người quản lý muốn đối chiếu một booking cũ.
 if(slotEnded(x.t,x.date||TODAY))UI.showPast=true;
 if(x.b!==A.br)A.br=x.b;
 const c=getCfg(A.br), t=minutes(x.t), start=minutes(c.open);
 UI.window=t>=start&&t<minutes(c.close)?tstr(start+Math.floor((t-start)/120)*120):'all';
 UI.room=getRooms(A.br).some(r=>r.id===x.r)?x.r:'all';
 UI.detail=null;UI.highlight=id;A.page='bk';render();
 document.querySelector('.schedule-wrap')?.scrollIntoView({block:'start',behavior:'smooth'});
}
function minutePlus(t,n){const [h,m]=t.split(':').map(Number),v=h*60+m+n;return String(Math.floor(v/60)).padStart(2,'0')+':'+String(v%60).padStart(2,'0')}

function saveRoomSettings(silent=false){
 const c=getCfg(A.br),start=$('branch-open')?.value,end=$('branch-close')?.value;
 const error=m=>{const el=$('settings-msg');if(el){el.textContent=m;el.style.color='#a0322c'}return false};
 const proper=t=>/^\d\d:\d\d$/.test(t)&&minutes(t)%10===0;
 if(!proper(start)||!proper(end)||minutes(end)<=minutes(start))return error('Giờ chi nhánh phải đúng mốc 10 phút và giờ đóng phải sau giờ mở.');
 const updated=[];
 for(const r of c.rooms){
  const price=Number($('price-'+r.id)?.value),n=$('name-'+r.id)?.value.trim(),t=$('style-'+r.id)?.value.trim(),o=$('open-'+r.id)?.value,e=$('close-'+r.id)?.value,active=$('enabled-'+r.id)?.checked;

  updated.push({...r,n,t,price,open:o,close:e,active:!!active});
 }

 if(!['booked','shoot'].includes(st))return fail('Trạng thái không hợp lệ.');

 });
