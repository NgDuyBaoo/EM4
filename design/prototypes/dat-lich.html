<!DOCTYPE html>
<html lang="vi"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ngói Photobooth – Đặt lịch</title>
<meta name="description" content="Đặt lịch chụp photobooth tại Ngói, Huế.">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Be+Vietnam+Pro:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#F6EFE6;--surface:#FFFBF6;--ink:#3B2416;--muted:#8A6F5C;--brand:#7A4A2B;--brand-ink:#FFF8F0;--line:#E4D6C6;--sel:#F3DDBB;
--free:#CDE8CB;--booked:#F8D49A;--shoot:#BBD6F3;--cancel:#F4B9B5;--done:#D9D2CA;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1D140E;--surface:#2A1D14;--ink:#F3E6D6;--muted:#B49A82;--brand:#D9A06B;--brand-ink:#2A1608;--line:#4A3626;--sel:#4A3320;--free:#2F5A33;--booked:#7A5A22;--shoot:#2D4E73;--cancel:#7A3A36;--done:#4A4038;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1D140E;--surface:#2A1D14;--ink:#F3E6D6;--muted:#B49A82;--brand:#D9A06B;--brand-ink:#2A1608;--line:#4A3626;--sel:#4A3320;--free:#2F5A33;--booked:#7A5A22;--shoot:#2D4E73;--cancel:#7A3A36;--done:#4A4038;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.55 'Be Vietnam Pro',system-ui,sans-serif}
h1,h2,h3,.serif{font-family:'Playfair Display',Georgia,serif;margin:0}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 20px;background:var(--brand);color:var(--brand-ink)}
.logo{font:700 30px/1 'Playfair Display',serif}.logo small{display:block;font:500 9px 'Be Vietnam Pro';letter-spacing:.3em}
.tabs{display:flex;background:rgba(0,0,0,.18);border-radius:999px;padding:3px}
.tabs button{border:0;background:none;color:inherit;padding:6px 14px;border-radius:999px;font:500 13px inherit;cursor:pointer}
.tabs button.on{background:var(--brand-ink);color:var(--brand)}
main{max-width:880px;margin:0 auto;padding:20px 16px 48px}
.steps{display:flex;gap:6px;margin-bottom:20px}
.steps i{flex:1;height:5px;border-radius:3px;background:var(--line)}.steps i.on{background:var(--brand)}
h2{font-size:26px;margin-bottom:4px}.sub{color:var(--muted);margin:0 0 18px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px}
.opt{display:flex;gap:14px;align-items:center;width:100%;text-align:left;background:var(--surface);color:inherit;border:1.5px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px;cursor:pointer;font:inherit}
.opt.on{border-color:var(--brand);background:var(--sel)}
.ph{width:84px;height:64px;border-radius:10px;flex:none;background:linear-gradient(135deg,#C9A27A,#7A4A2B)}
.opt b{display:block;font-size:16px}.opt span{color:var(--muted);font-size:13px}
.btn{background:var(--brand);color:var(--brand-ink);border:0;border-radius:10px;padding:12px 22px;font:600 15px inherit;cursor:pointer}
.btn:disabled{opacity:.4;cursor:not-allowed}.btn.ghost{background:none;color:var(--brand);border:1.5px solid var(--brand)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:18px}
.code{display:flex;gap:8px;justify-content:center;margin:12px 0}
.code input{width:46px;height:56px;text-align:center;font:600 24px 'Playfair Display',serif;border:1.5px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink)}
input.f,select{width:100%;padding:11px 12px;border:1.5px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);font:inherit;margin-bottom:10px}
.hint{font-size:12.5px;color:var(--muted);text-align:center}.err{color:#C0392B;text-align:center;min-height:22px;font-size:13.5px}
.slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(62px,1fr));gap:6px;max-height:340px;overflow:auto;padding:2px}
.slot{padding:10px 0;border:1.5px solid var(--line);border-radius:9px;background:var(--surface);color:var(--ink);font:500 14px inherit;cursor:pointer}
.slot.on{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.slot:disabled{opacity:.35;text-decoration:line-through;cursor:not-allowed}
dl{display:grid;grid-template-columns:90px 1fr;gap:8px 12px;margin:0}dt{color:var(--muted)}dd{margin:0;font-weight:500}
.ok{width:72px;height:72px;border-radius:50%;background:var(--brand);color:var(--brand-ink);display:grid;place-items:center;font-size:36px;margin:0 auto 12px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:16px}
.stat b{font:700 26px 'Playfair Display',serif;display:block}.stat span{color:var(--muted);font-size:13px}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:13px;margin:10px 0}.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.scroll{overflow-x:auto;max-height:300px;overflow-y:auto}
table{border-collapse:collapse;width:100%;font-size:14px}th,td{padding:8px 10px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
.g td.c{height:26px;border-left:2px solid var(--bg)}
.pill{padding:3px 10px;border-radius:999px;font-size:12.5px;font-weight:500;color:#2B1B10}
.s-booked{background:var(--booked)}.s-shoot{background:var(--shoot)}.s-cancel{background:var(--cancel)}.s-done{background:var(--done)}
td button{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:7px;padding:4px 9px;margin-right:4px;font:inherit;font-size:12.5px;cursor:pointer}
.hide{display:none}
.slot{position:relative}.slot.off{color:var(--muted);background:var(--bg);text-decoration:line-through;cursor:not-allowed}.slot.off:hover{border-color:var(--line);background:var(--bg)}
header{position:relative;margin-bottom:16px;background:radial-gradient(circle at 11px 0,transparent 8px,rgba(255,248,240,.14) 8.5px 9.5px,transparent 10px) 0 0/22px 11px,var(--brand)}
header::after{content:"";position:absolute;left:0;right:0;top:100%;height:11px;background:radial-gradient(circle at 11px 0,var(--brand) 10px,transparent 10.5px) 0 0/22px 11px}
.logo{font-size:34px;letter-spacing:-.01em}
h2{font-size:30px;line-height:1.2;letter-spacing:-.01em}
.sub{font-size:14.5px;max-width:56ch}
main{padding-top:24px}
.card{border-radius:20px;padding:20px;box-shadow:0 10px 30px -18px rgba(59,36,22,.45)}
.steps{gap:8px}.steps i{height:6px;border-radius:6px;transition:background .3s}
.opt{position:relative;border-radius:20px;padding:14px 16px;transition:transform .15s,box-shadow .15s,border-color .15s}
.opt:hover{transform:translateY(-1px)}
.opt.on{box-shadow:0 0 0 4px var(--sel);border-color:var(--brand)}
.opt.on::after{content:"✓";position:absolute;right:16px;top:14px;width:26px;height:26px;border-radius:50%;background:var(--brand);color:var(--brand-ink);display:grid;place-items:center;font-size:14px;font-weight:600}
.opt b{font:600 19px 'Playfair Display',serif}
.ph{width:104px;height:80px;border:5px solid #FFFBF6;border-radius:6px;box-shadow:0 4px 12px -4px rgba(59,36,22,.5);transform:rotate(-3deg);background:linear-gradient(160deg,#E2C49C,#B07A4D 55%,#7A4A2B)}
.opt:nth-of-type(even) .ph{transform:rotate(2.5deg)}
.btn{border-radius:12px;padding:14px 26px;box-shadow:0 8px 18px -10px var(--brand);transition:transform .15s}
.btn:hover:not(:disabled){transform:translateY(-1px)}
.btn.ghost{box-shadow:none}
.slot{border-radius:10px;padding:7px 0;font-size:13.5px;transition:border-color .15s,background .15s}
.slot:hover:not(:disabled){border-color:var(--brand);background:var(--sel)}
.slot.on{box-shadow:0 6px 14px -8px var(--brand)}
.code input{width:50px;height:60px;border-radius:12px}
.code input:focus,input.f:focus,select:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 4px var(--sel)}
button:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
.ok{box-shadow:0 0 0 8px var(--sel)}
.stat{padding:16px 18px}.stat b{font-size:30px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
/* Một lưới giờ liên tục, nhỏ gọn trên cả điện thoại và máy tính */
.slots.compact-slots{grid-template-columns:repeat(auto-fill,minmax(68px,1fr));gap:7px;max-height:308px;overflow-y:auto;overscroll-behavior:contain;padding:4px 3px 8px;scrollbar-width:thin}
.compact-slots .slot{min-height:36px;padding:7px 3px;border-radius:8px;font-size:12.5px;line-height:1.15}
.compact-slots .slot.on:hover{background:var(--brand);color:var(--brand-ink)}
@media(max-width:480px){.slots.compact-slots{grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;max-height:296px}.compact-slots .slot{min-height:36px;font-size:12.5px}}
.range-picker{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:7px}.range-btn{padding:10px 3px;border:1.5px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);font:500 12px 'Be Vietnam Pro',sans-serif;cursor:pointer}.range-btn.active{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}.range-btn small{font-size:11px}.compact-slots{grid-template-columns:repeat(6,minmax(0,1fr));max-height:none;overflow:visible}.compact-slots .slot{padding:10px 0}@media(max-width:550px){.range-picker{grid-template-columns:repeat(2,minmax(0,1fr))}.compact-slots{grid-template-columns:repeat(3,minmax(0,1fr))}}
/* Tooltip nổi ngoài lưới: không bị che bởi thẻ giờ hoặc khung cuộn. */
#booking-time-tooltip{position:fixed;z-index:9999;display:none;pointer-events:none;padding:8px 12px;border-radius:9px;background:var(--ink);color:var(--bg);font:600 12px 'Be Vietnam Pro',sans-serif;white-space:nowrap;box-shadow:0 6px 16px rgba(0,0,0,.2)}
#booking-time-tooltip.visible{display:block}
.slot.off[data-tip="Đã đặt"]{text-decoration:line-through;text-decoration-thickness:1.5px}
.slot.off[data-tip]:hover,.slot.off[data-tip]:focus-visible{border-color:var(--muted);background:var(--bg)}

/* Thông tin địa chỉ, bản đồ và liên hệ chỉ hiển thị trong trang Liên hệ. */
.branch-footer{display:flex;align-items:center;justify-content:space-between;gap:10px 14px;flex-wrap:wrap;margin:0 17px;padding:11px 0 13px;border-top:1px solid var(--line)}
.branch-phone{display:inline-flex;align-items:center;gap:7px;font:500 13px 'Be Vietnam Pro',sans-serif;color:var(--ink);min-width:0}
.branch-phone svg,.branch-map svg{width:16px;height:16px;flex:none}
.branch-phone a{color:var(--brand);font-weight:600;text-decoration:none}
.branch-phone a:hover{text-decoration:underline}
.branch-phone .no-phone{color:var(--muted);font-weight:400}
.branch-actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.branch-map{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);padding:7px 11px;border-radius:10px;background:var(--surface);color:var(--brand);text-decoration:none;font:600 12.5px 'Be Vietnam Pro',sans-serif;white-space:nowrap;cursor:pointer}
.branch-map{border-color:var(--brand)}
.branch-map:hover{background:var(--sel)}
.branch-contact-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:12px}
.branch-mini{padding:16px 17px}
.branch-mini .branch-footer{margin:10px 0 0;padding-bottom:0}
.branch-mini-title{font:600 17px/1.3 'Playfair Display',serif}
.branch-mini-address{display:block;color:var(--muted);font-size:13px;margin-top:5px}
@media(max-width:530px){.branch-phone{width:100%}.branch-actions{width:100%}.branch-map{flex:1}}

/* Contact page — compact editorial layout; deliberately scoped to contact-* selectors. */
.contact-head{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;margin-bottom:18px}
.contact-head h2{margin:0 0 6px}
.contact-head .sub{margin:0;font-size:14px;line-height:1.6}
.contact-back{display:inline-flex;gap:6px;align-items:center;flex:none;border:1px solid var(--line);color:var(--brand);background:var(--surface);border-radius:10px;padding:9px 12px;font:600 12px 'Be Vietnam Pro',sans-serif;cursor:pointer}
.contact-back:hover{background:var(--sel)}
.contact-layout{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);align-items:start;gap:16px}
.contact-layout .card{padding:23px;border-radius:18px}
.contact-card-head{display:flex;align-items:center;gap:11px;margin-bottom:19px}
.contact-card-icon{display:grid;place-items:center;flex:none;width:38px;height:38px;border-radius:11px;color:var(--brand);background:var(--sel)}
.contact-card-icon svg{width:20px;height:20px}
.contact-card-head h3{font:700 18px/1.35 'Be Vietnam Pro',sans-serif;letter-spacing:-.025em;margin:0}
.contact-card-head p{font:400 12px/1.6 'Be Vietnam Pro',sans-serif;color:var(--muted);margin:3px 0 0}
.contact-form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 12px}
.contact-field{min-width:0}
.contact-field.wide{grid-column:1/-1}
.contact-field label{display:block;margin:0 0 6px;font-size:12.5px;font-weight:600;color:var(--ink)}
.contact-field .optional{font-size:11px;font-weight:400;color:var(--muted)}
.contact-field .required{color:#B86A45}
.contact-field input,.contact-field select,.contact-field textarea{display:block;width:100%;min-width:0;margin:0;border:1px solid var(--line);border-radius:10px;padding:11px 12px;background:var(--surface);color:var(--ink);font:400 13.5px/1.5 'Be Vietnam Pro',sans-serif;outline:none}
.contact-field input,.contact-field select{height:45px}
.contact-field textarea{resize:vertical;min-height:106px;max-height:260px}
.contact-field input::placeholder,.contact-field textarea::placeholder{color:var(--muted);opacity:.8}
.contact-field input:focus,.contact-field select:focus,.contact-field textarea:focus{border-color:var(--brand);box-shadow:0 0 0 3px var(--sel)}
.contact-form-bottom{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:16px}
.contact-demo-note{max-width:230px;color:var(--muted);font-size:11px;line-height:1.5}
.contact-submit{padding:11px 18px;min-height:44px;white-space:nowrap;font-size:13.5px}
.contact-error{display:none;margin:10px 0 0;color:#B4362A;font-size:12.5px}
.contact-error.visible{display:block}
.contact-location-item{padding:13px 0 14px;border-top:1px solid var(--line)}
.contact-location-item:first-child{padding-top:1px;border-top:0}
.contact-place-top{display:flex;gap:10px;align-items:start}
.contact-place-number{flex:none;display:grid;place-items:center;background:var(--bg);color:var(--muted);font-weight:600;font-size:11px;width:28px;height:28px;border-radius:8px}
.contact-place-name{font:600 14px/1.4 'Be Vietnam Pro',sans-serif;letter-spacing:-.02em}
.contact-place-address{font-size:12.5px;color:var(--muted);margin-top:3px}
.contact-place-detail{margin:11px 0 12px 38px;display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--muted)}
.contact-place-detail svg{width:15px;height:15px;flex:none;color:var(--brand)}
.contact-place-detail a{color:var(--brand);font-weight:600;text-decoration:none}
.contact-map-btn{margin-left:38px;display:inline-flex;align-items:center;gap:7px;color:var(--brand);font:600 12.5px 'Be Vietnam Pro',sans-serif;text-decoration:none;padding:8px 10px;border:1px solid var(--line);border-radius:9px;background:var(--surface)}
.contact-map-btn:hover{background:var(--sel);border-color:var(--brand)}
.contact-map-btn svg{width:15px;height:15px}
.contact-map-hint{border-top:1px solid var(--line);padding-top:12px;margin:0;color:var(--muted);font-size:11px;line-height:1.6}
.contact-success{max-width:510px;margin:12px auto 0;text-align:center}
.contact-success h2{font-size:25px}
.contact-success p{margin:6px auto 16px;color:var(--muted);font-size:13.5px}
@media(max-width:720px){.contact-layout{grid-template-columns:minmax(0,1fr)}.contact-layout .card{padding:20px}.contact-form-bottom{flex-wrap:wrap}.contact-demo-note{max-width:none}}
@media(max-width:430px){.contact-head{display:block}.contact-back{margin-top:13px}.contact-form-grid{grid-template-columns:minmax(0,1fr);gap:12px}.contact-form-bottom{display:flex;flex-direction:column-reverse;align-items:stretch}.contact-submit{width:100%}.contact-demo-note{text-align:center}}

/* Nút điều hướng thống nhất ở Lịch của tôi và Liên hệ: chỉ chữ ở trạng thái thường. */
.page-text-btn{display:inline-flex;align-items:center;justify-content:center;border:1px solid transparent;background:transparent;color:var(--brand);padding:10px 16px;border-radius:10px;font:600 13px 'Be Vietnam Pro',sans-serif;cursor:pointer;box-shadow:none;text-decoration:none;transition:background .16s,color .16s,border-color .16s}
.page-text-btn:hover{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.page-text-btn:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
/* ===== Làm mới giao diện: màu nhấn, header phẳng, pill dịu, công tắc sáng/tối ===== */
:root{--accent:#B85A25;--accent-ink:#FFFFFF}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--accent:#E08A4F;--accent-ink:#2A1608}}
:root[data-theme="dark"]{--accent:#E08A4F;--accent-ink:#2A1608}
header{background:var(--brand);border-bottom:1px solid rgba(0,0,0,.12)}
header::after{display:none}
.btn:not(.ghost){background:var(--accent);color:var(--accent-ink);box-shadow:0 8px 18px -12px var(--accent)}
.btn:not(.ghost):disabled{opacity:.45}
.steps i.on{background:var(--accent)}
.slot.on,.compact-slots .slot.on:hover{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.opt.on{border-color:var(--accent);box-shadow:0 0 0 4px var(--sel)}
.opt.on::after,.ok{background:var(--accent);color:var(--accent-ink)}
.ph,.opt:nth-of-type(even) .ph{transform:none;border:0;border-radius:14px;box-shadow:0 6px 16px -8px rgba(59,36,22,.45)}
.stat b,.stat strong{font-family:'Be Vietnam Pro',system-ui,sans-serif;font-weight:700;letter-spacing:-.02em}
.pill{position:relative;padding:3px 11px 3px 23px;background:var(--surface)!important;border:1px solid var(--line);color:var(--ink)}
.pill::before{content:"";position:absolute;left:9px;top:50%;width:8px;height:8px;margin-top:-4px;border-radius:50%;background:var(--dot,var(--muted))}
.s-booked{--dot:#E5A23A}.s-shoot{--dot:#4A90D9}.s-cancel{--dot:#D9534F}.s-done{--dot:#9A8F84}
.theme-btn{border:1px solid currentColor;background:none;color:var(--brand-ink);border-radius:10px;padding:7px 11px;font-size:14px;line-height:1;cursor:pointer}
.site-foot{max-width:880px;margin:0 auto;padding:14px 16px 32px;display:flex;justify-content:space-between;gap:8px 16px;flex-wrap:wrap;border-top:1px solid var(--line);color:var(--muted);font-size:12.5px}.site-foot a{color:var(--brand);text-decoration:none;font-weight:500}.site-foot a:hover{text-decoration:underline}
</style></head><body><div id="booking-time-tooltip" role="tooltip" aria-hidden="true"></div>
<header><div class="logo">Ngói<small>PHOTOBOOTH</small></div><div style="display:flex;gap:8px"><button class="btn ghost" onclick="openMine()" style="color:var(--brand-ink);border-color:var(--brand-ink);padding:7px 14px;font-size:13px">Lịch của tôi</button><button class="btn ghost" onclick="openContact()" style="color:var(--brand-ink);border-color:var(--brand-ink);padding:7px 14px;font-size:13px">Liên hệ</button></div>
</header>
<main><div id="app"></div></main>
<footer class="site-foot"><span>Ngói Photobooth · Huế · <span id="store-state"></span></span><span><a href="index.html">Giới thiệu bản demo</a> · <a href="quan-ly.html">Trang quản lý (nhân viên)</a></span></footer>
<script src="firebase-config.js"></script>
<script src="ngoi-store.js"></script>
<script>
// Dữ liệu chi nhánh, phòng, giá, giờ mở cửa và booking lấy từ kho dùng chung (ngoi-store.js),
// nên mọi thay đổi ở trang Quản lý được áp dụng ngay cho trang này.
const NS=window.NgoiStore;
const BR=NS.BRANCHES;
const ST={booked:['Đã đặt','s-booked'],shoot:['Đang chụp','s-shoot'],cancel:['Đã hủy','s-cancel'],done:['Hoàn thành','s-done']};
const pad=n=>String(n).padStart(2,'0');
const dowN=['Chủ nhật','Thứ 2','Thứ 3','Thứ 4','Thứ 5','Thứ 6','Thứ 7'];

let DB,RM=[],bookings=[],TODAY='',dlabel='';

function render(){
 // Trang mở qua nửa đêm: chuyển sang ngày mới, bỏ các giờ đã chọn của ngày cũ.
 if(NS.today()!==TODAY){sync();if(S.sel.length){S.sel=[];if(S.step===4||S.step===5){S.step=4;S.err='Đã sang ngày mới ('+dlabel+'). Vui lòng chọn lại giờ.'}}}
 if(typeof hideBookingTooltip==='function' && typeof bookingTooltip!=='undefined')hideBookingTooltip();$('app').innerHTML=user();const ss=$('store-state');if(ss)ss.textContent=NS.statusText();if(S.step===1)bindCode()}
function bar(){return '<div class="steps">'+[1,2,3,4,5,6].map(i=>`<i class="${i<=S.step?'on':''}"></i>`).join('')+'</div>'}
function nav(back,next,label,dis){return `<div class="row">${back?`<button class="btn ghost" onclick="go(${back})">Quay lại</button>`:''}<button class="btn" ${dis?'disabled':''} onclick="${next}">${label}</button></div>`}
function user(){
 const s=S.step;let h=s>=7?'':bar();
 if(s===1)h+=`<div class="card" style="text-align:center;max-width:440px;margin:0 auto"><h2>Nhập mã truy cập</h2><p class="sub">Mã 6 số thay đổi mỗi ngày, có tại quầy Ngói.</p><div class="code">${[0,1,2,3,4,5].map(i=>`<input maxlength="1" inputmode="numeric" data-i="${i}" aria-label="Số ${i+1}">`).join('')}</div><div class="err" id="err">${S.err}</div><button class="btn" style="width:100%" onclick="checkCode()">Vào trang đặt lịch</button><p class="hint" style="margin-top:12px">Bản demo: mã hôm nay là <b>${NS.todayCode()}</b> (nhân viên xem trong trang Quản lý)</p></div>`;
 if(s===2)h+=`<h2>Chọn chi nhánh</h2><p class="sub">Ngói có 2 chi nhánh tại Huế.</p>`+BR.map(b=>`<button class="opt ${S.b===b.id?'on':''}" onclick="S.b='${b.id}';S.rs=[];S.sel=[];render()"><div class="ph"></div><div><b>${b.n}</b><span>${b.a} · Mở cửa ${cfgOf(b.id).open}–${cfgOf(b.id).close} · ${branchRooms(b.id).length} phòng</span></div></button>`).join('')+nav(1,'go(3)','Tiếp tục',!S.b);
 if(s===3)h+=`<h2>Chọn phòng chụp</h2><p class="sub">Mỗi phòng có một phong cách riêng. Bạn có thể chọn nhiều phòng cùng lúc.</p>`+(branchRooms(S.b).length?'':'<div class="card">Chi nhánh tạm thời chưa nhận đặt phòng. Vui lòng chọn chi nhánh khác.</div>')+branchRooms(S.b).map(r=>`<button class="opt ${S.rs.includes(r.id)?'on':''}" aria-pressed="${S.rs.includes(r.id)}" onclick="togR('${r.id}')"><div class="ph"></div><div><b>${esc(r.n)}${hot(r)}</b><span>${esc(r.t)} · ${vnd(r.d)} / slot 10 phút<br>${nBook(S.b,r.id)} lượt đặt trong 30 ngày qua</span></div></button>${peek(r)}`).join('')+nav(2,'go(4)','Tiếp tục',!S.rs.length);
 if(s===4)h+=`<h2>Chọn khung giờ</h2><p class="sub">${dlabel} · mỗi slot 10 phút, từ ${cfgOf(S.b).open} đến ${cfgOf(S.b).close}. Chọn khoảng giờ rồi bấm vào giờ muốn chụp; giờ đã qua hoặc đã có người đặt sẽ bị gạch.</p>`+slotView()+(S.err?`<div class="err" role="alert" style="margin-top:12px">${S.err}</div>`:'')+nav(3,'go(5)','Tiếp tục',!S.sel.length);
 if(s===5){const b=by(BR,S.b);
  h+=`<h2>Xác nhận thông tin</h2><p class="sub">Kiểm tra lại trước khi đặt lịch.</p><div class="card"><dl><dt>Chi nhánh</dt><dd>${b.n} (${b.a})</dd><dt>Ngày</dt><dd>${dlabel}</dd>${sumRows()}</dl></div><div style="margin-top:14px"><input class="f" id="nm" placeholder="Tên của bạn" value="${esc(S.name)}" maxlength="80" autocomplete="name"><input class="f" id="ph" inputmode="tel" placeholder="Số điện thoại" value="${esc(S.phone)}" maxlength="20" autocomplete="tel"><div class="err">${esc(S.err)}</div></div>`+nav(4,'confirmBooking()',S.busy?'Đang giữ chỗ…':'Xác nhận đặt lịch',!!S.busy);}
 if(s===7)h+=mineView();
 if(s===8)h+=contactView();
 if(s===6){const b=by(BR,S.b);h+=`<div class="card" style="text-align:center;max-width:440px;margin:0 auto"><div class="ok">✓</div><h2>Đặt lịch thành công!</h2><p class="sub">Vui lòng đến đúng giờ. Hẹn gặp bạn tại Ngói!</p><div style="margin:0 auto 16px;padding:12px;border:2px dashed var(--brand);border-radius:14px;max-width:320px"><div style="font-size:12.5px;color:var(--muted)">Mã booking (đưa cho nhân viên khi đến)</div><div style="font:700 28px 'Playfair Display',serif;letter-spacing:.08em;color:var(--brand)">${S.code}</div></div><dl style="text-align:left;margin:0 auto 16px;max-width:320px"><dt>Chi nhánh</dt><dd>${b.n}</dd><dt>Ngày</dt><dd>${dlabel}</dd>${sumRows()}</dl><button class="btn" onclick="openMine()">Xem lịch của tôi</button> <button class="btn ghost" onclick="reset()">Đặt thêm lịch</button></div>`}
 return h}
function bindCode(){const ins=[...document.querySelectorAll('.code input')];ins.forEach((el,i)=>{el.oninput=()=>{el.value=el.value.replace(/\D/g,'');if(el.value&&ins[i+1])ins[i+1].focus()};el.onkeydown=e=>{if(e.key==='Backspace'&&!el.value&&ins[i-1])ins[i-1].focus();if(e.key==='Enter')checkCode()}});ins[0].focus()}
function checkCode(){const v=[...document.querySelectorAll('.code input')].map(i=>i.value).join('');if(v===NS.todayCode()){S.unlocked=true;go(2)}else{S.err='Mã chưa đúng. Kiểm tra lại mã 6 số hôm nay.';$('err').textContent=S.err}}
function confirmBooking(){if(S.busy)return;S.name=$('nm').value.trim();S.phone=$('ph').value.trim();
 const digits=S.phone.replace(/[\s.\-]/g,'').replace(/^\+/,'');
 if(!S.name){S.err='Vui lòng nhập tên của bạn.';render();return}
 if(!/^(?:0\d{9}|84\d{9})$/.test(digits)){S.err='Nhập số điện thoại hợp lệ: 10 số bắt đầu bằng 0 (ví dụ 0912 345 678).';render();return}
 if(!S.sel.length){S.step=4;S.err='Bạn chưa chọn khung giờ nào (hoặc giờ đã chọn vừa có người đặt). Vui lòng chọn lại.';render();return}
 const dayBefore=TODAY;
 sync(); // lấy dữ liệu mới nhất: có thể vừa có người đặt ở tab hoặc quầy khác
 if(TODAY!==dayBefore){S.sel=[];S.step=4;S.err='Đã sang ngày mới ('+dlabel+'). Vui lòng chọn lại giờ.';render();return}
 const lost=S.sel.filter(k=>{const[r,t]=k.split('|');return taken(S.b,r,t)||!inHours(by(RM,r),t)});
 if(lost.length){S.err='Có khung giờ vừa có người đặt hoặc phòng đã đổi giờ. Vui lòng chọn giờ khác.';S.sel=S.sel.filter(k=>!lost.includes(k));S.step=4;render();return}
 if(S.sel.some(k=>past(k.split('|')[1]))){S.err='Có khung giờ đã qua trong lúc bạn đang đặt. Vui lòng chọn giờ khác.';S.sel=S.sel.filter(k=>!past(k.split('|')[1]));S.step=4;render();return}
 // Giữ chỗ: chế độ máy chủ dùng giao dịch trên Firebase nên hai máy không thể đặt trùng một khung.
 const recs=S.sel.map(k=>{const[r,t]=k.split('|');return {b:S.b,r,t,name:S.name,phone:S.phone,st:'booked',source:'online'}});
 S.busy=true;render();
 NS.reserve(recs).then(res=>{S.busy=false;
  if(res.ok){NS.addMine(res.ids);S.code=res.code;sync();go(6);return}
  sync();
  if(res.reason==='full'){S.err=STORE_FULL;render();return}
  if(res.reason==='network'){S.err='Chưa đặt được vì không kết nối được máy chủ. Vui lòng kiểm tra mạng rồi bấm xác nhận lại.';render();return}
  const keep=S.sel.filter(k=>{const[r,t]=k.split('|');return !taken(S.b,r,t)});S.sel=keep.length<S.sel.length?keep:[];
  S.err='Có khung giờ vừa có người đặt ở nơi khác. Vui lòng chọn giờ khác.';S.step=4;render()})}
// Hiển thị trạng thái giờ khi rê chuột hoặc dùng bàn phím.
const bookingTooltip = document.getElementById('booking-time-tooltip');
let tooltipTarget = null;
function hideBookingTooltip(){ bookingTooltip.classList.remove('visible'); bookingTooltip.setAttribute('aria-hidden','true'); tooltipTarget=null; }
function positionBookingTooltip(el){
 if(!el || !el.isConnected) return hideBookingTooltip();
 const r=el.getBoundingClientRect(), w=bookingTooltip.offsetWidth || 75, h=bookingTooltip.offsetHeight || 34;
 const left=Math.min(Math.max(r.left + r.width/2-w/2, 8), window.innerWidth-w-8);
 const top=r.top >= h+12 ? r.top-h-8 : Math.min(r.bottom+8, window.innerHeight-h-8);
 bookingTooltip.style.left=Math.round(left)+'px'; bookingTooltip.style.top=Math.round(top)+'px';
}
function showBookingTooltip(el){
 if(!el || !el.dataset.tip) return hideBookingTooltip();
 tooltipTarget=el; bookingTooltip.textContent=el.dataset.tip;
 bookingTooltip.classList.add('visible'); bookingTooltip.setAttribute('aria-hidden','false');
 positionBookingTooltip(el);
}
document.addEventListener('pointerover',e=>{const el=e.target.closest?.('.slot.off[data-tip]');if(el)showBookingTooltip(el);else if(tooltipTarget)hideBookingTooltip()});
document.addEventListener('pointerout',e=>{if(tooltipTarget && e.target===tooltipTarget)hideBookingTooltip()});
document.addEventListener('focusin',e=>{const el=e.target.closest?.('.slot.off[data-tip]');if(el)showBookingTooltip(el);else hideBookingTooltip()});
document.addEventListener('focusout',e=>{if(tooltipTarget && e.target===tooltipTarget)hideBookingTooltip()});
window.addEventListener('scroll',()=>{if(tooltipTarget)positionBookingTooltip(tooltipTarget)},true);
window.addEventListener('resize',()=>{if(tooltipTarget)positionBookingTooltip(tooltipTarget)});
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&S.step===4)render()});
NS.onChange(()=>{sync();
 if(S.b&&!branchRooms(S.b).length&&S.step>=3&&S.step<=5){S.rs=[];S.sel=[]}
 S.rs=S.rs.filter(id=>branchRooms(S.b).some(r=>r.id===id));
 const before=S.sel.length;S.sel=S.sel.filter(k=>{const[r,t]=k.split('|');return S.rs.includes(r)&&!taken(S.b,r,t)&&inHours(by(RM,r),t)});
 const lostSel=S.sel.length<before&&S.step>=4&&S.step<=5;
 if(lostSel){if(S.step===5&&$('nm')){S.name=$('nm').value;S.phone=$('ph').value}S.err='Một số giờ bạn chọn vừa có người đặt nên đã được bỏ chọn.';S.step=4}
 // Mất giờ đã chọn thì luôn vẽ lại ngay (kể cả khi đang gõ), để khách không bấm xác nhận trên màn hình cũ.
 if(lostSel||!document.activeElement?.closest('input,textarea,select'))render()});
setInterval(()=>{if(S.step===4&&!document.activeElement?.closest('input,textarea,select'))render()},60000);
render();
</script><script>
(function(){
 var root=document.documentElement,KEY='ngoi_theme_v1';
 function cur(){return root.getAttribute('data-theme')||(window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light')}
 try{var saved=localStorage.getItem(KEY);if(saved==='dark'||saved==='light')root.setAttribute('data-theme',saved)}catch(e){}
 var host=document.querySelector('header .tabs')||document.querySelector('header > div:last-child');
 if(!host)return;
 var b=document.createElement('button');b.type='button';b.className='theme-btn';
 function paint(){var d=cur()==='dark';b.textContent=d?'☀️':'🌙';b.title=d?'Chuyển sang nền sáng':'Chuyển sang nền tối';b.setAttribute('aria-label',b.title)}
 b.onclick=function(){var n=cur()==='dark'?'light':'dark';root.setAttribute('data-theme',n);try{localStorage.setItem(KEY,n)}catch(e){}paint()};
 paint();host.appendChild(b);
})();
</script></body></html>
