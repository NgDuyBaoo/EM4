# docker compose -f deploy/docker-compose.yml --env-file deploy/.env up -d --build
# Web: http://localhost:8080   ·   Quản lý: /admin   ·   API docs: /docs/api   ·   Telescope: /telescope   ·   Pulse: /pulse
name: ngoi-photobooth

# Biến môi trường chung cho mọi container Laravel. Service con gộp vào bằng `<<: *env`:
# nếu khai báo `environment:` riêng mà không gộp, YAML sẽ thay cả khối và mất DB_CONNECTION (quay về sqlite).
x-env: &env
  APP_ENV: production
  APP_DEBUG: "false"
  DB_CONNECTION: mysql
  DB_HOST: mysql
  CACHE_STORE: redis
  QUEUE_CONNECTION: redis
  SESSION_DRIVER: redis
  REDIS_CLIENT: predis
  REDIS_HOST: redis
  LOG_CHANNEL: stack
  LOG_STACK: daily,stderr

x-app: &app
  build: { context: .., dockerfile: deploy/docker/app.Dockerfile }
  image: ngoi-app:latest
  restart: unless-stopped
  env_file: .env
  environment: *env
  depends_on:
    mysql: { condition: service_healthy }
    redis: { condition: service_started }

services:
  app:
    <<: *app
    ports: ["8080:8080"]

  # Xử lý hàng đợi: gửi email xác nhận booking
  queue:
    <<: *app
    command: ["php", "/var/www/html/backend/artisan", "queue:work", "--tries=3", "--max-time=3600"]
    environment: { <<: *env, AUTORUN_ENABLED: "false" }
    healthcheck: { disable: true }

  # Lịch chạy định kỳ: tự hủy booking quá giờ, dọn Telescope
  scheduler:
    <<: *app
    command: ["php", "/var/www/html/backend/artisan", "schedule:work"]
    environment: { <<: *env, AUTORUN_ENABLED: "false" }
    healthcheck: { disable: true }

  # Pulse: thu thập CPU / RAM / ổ đĩa máy chủ
  pulse:
    <<: *app
    command: ["php", "/var/www/html/backend/artisan", "pulse:check"]
    environment: { <<: *env, AUTORUN_ENABLED: "false" }
    healthcheck: { disable: true }

  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-ngoi}
      MYSQL_USER: ${DB_USERNAME:-ngoi}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Cần DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Cần MYSQL_ROOT_PASSWORD}
      TZ: Asia/Ho_Chi_Minh
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci", "--default-time-zone=+07:00"]
    volumes: [mysql-data:/var/lib/mysql]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes: [redis-data:/data]

volumes:
  mysql-data:
  redis-data:
