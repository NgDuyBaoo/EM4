# Asset Vite có hash trong tên file (app-3f9a1c.css) nên cache 1 năm, không cần hỏi lại server.
location /build/ {
    expires 1y;
    add_header Cache-Control "public, max-age=31536000, immutable";
    access_log off;
    try_files $uri =404;
}

# Ảnh, font tĩnh khác: cache 7 ngày
location ~* \.(?:svg|ico|png|jpe?g|webp|avif|woff2?)$ {
    expires 7d;
    add_header Cache-Control "public, max-age=604800";
    access_log off;
    try_files $uri =404;
}
